<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // BANCA DE INTELIGENCIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --morado: #bc13fe; 
            --negro: #000; 
            --border: rgba(188, 19, 254, 0.15);
            --texto-dim: #888;
        }
        * { box-sizing: border-box; outline: none; }
        
        /* El Universo de fondo */
        body { 
            background: var(--negro); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 0, 30, 1) 0%, rgba(0, 0, 0, 1) 100%),
                url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        /* Ticker Minimalista y Delicado */
        .top-bar { 
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 10px 40px; 
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem; 
            display: flex; 
            justify-content: center;
            gap: 40px; 
            letter-spacing: 2px;
            color: var(--texto-dim);
        }
        .up { color: #39ff14; text-shadow: 0 0 5px rgba(57, 255, 20, 0.3); }
        .down { color: #ff3131; text-shadow: 0 0 5px rgba(255, 49, 49, 0.3); }

        /* Header Etéreo */
        header { 
            padding: 40px 20px; 
            text-align: center; 
            position: relative;
        }
        .logo { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 2.2rem; 
            letter-spacing: 12px; 
            font-weight: 300;
            text-transform: uppercase;
        }
        .logo span { color: var(--morado); filter: drop-shadow(0 0 15px var(--morado)); }
        .sys-status { 
            font-family: 'Share Tech Mono'; 
            font-size: 0.6rem; 
            color: var(--morado); 
            opacity: 0.6; 
            margin-top: 15px; 
            letter-spacing: 4px;
        }

        /* Estructura de la Banca */
        .main-container { 
            max-width: 1600px; 
            margin: 0 auto; 
            padding: 0 40px 100px; 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 60px; 
        }

        /* Noticia Líder (Hero) */
        .hero-section { position: relative; margin-bottom: 80px; cursor: pointer; }
        .hero-image { 
            width: 100%; 
            height: 600px; 
            background-color: #050505;
            background-size: cover; 
            background-position: center; 
            filter: grayscale(0.2) contrast(1.1);
            border: 1px solid var(--border);
            transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .hero-section:hover .hero-image { border-color: var(--morado); filter: grayscale(0); }
        
        .hero-content { 
            position: absolute; 
            bottom: -40px; 
            left: 40px; 
            right: 40px; 
            background: rgba(5, 5, 5, 0.85); 
            backdrop-filter: blur(20px);
            padding: 40px; 
            border: 1px solid var(--border);
        }
        .category { 
            color: var(--morado); 
            font-family: 'Share Tech Mono'; 
            font-size: 0.7rem; 
            letter-spacing: 5px; 
            margin-bottom: 15px; 
        }
        .hero-title { font-size: 2.8rem; font-weight: 600; line-height: 1; margin: 0 0 20px; letter-spacing: -1px; }
        .hero-desc { font-size: 1rem; color: var(--texto-dim); line-height: 1.6; max-width: 80%; }

        /* Nodos Geográficos */
        .section-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 40px; 
        }
        .node-card { 
            border-top: 1px solid var(--border); 
            padding-top: 20px; 
            transition: 0.3s;
        }
        .node-card:hover { border-top-color: var(--morado); }
        .node-thumb { 
            width: 100%; 
            height: 220px; 
            background: #050505; 
            margin-bottom: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .node-title { font-size: 1.2rem; font-weight: 600; line-height: 1.4; color: #fff; }

        /* Sidebar: Radar Busca */
        .sidebar { border-left: 1px solid var(--border); padding-left: 40px; }
        .sidebar-h { 
            font-family: 'Share Tech Mono'; 
            font-size: 0.8rem; 
            color: var(--morado); 
            margin-bottom: 40px; 
            letter-spacing: 3px;
        }
        .side-item { 
            margin-bottom: 40px; 
            transition: 0.3s;
        }
        .side-time { font-family: 'Share Tech Mono'; font-size: 0.6rem; color: #444; margin-bottom: 8px; }
        .side-title { 
            font-size: 1rem; 
            line-height: 1.4; 
            color: #aaa; 
            text-decoration: none;
            display: block;
        }
        .side-item:hover .side-title { color: #fff; }

        /* Scrollbar Sutil */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--negro); }
        ::-webkit-scrollbar-thumb { background: var(--morado); border-radius: 10px; }

        @media (max-width: 1200px) {
            .main-container { grid-template-columns: 1fr; }
            .sidebar { border-left: none; padding-left: 0; margin-top: 60px; }
        }
    </style>
</head>
<body>

<div class="top-bar" id="ticker-assets"></div>

<header>
    <div class="logo">NVVEX // <span>BANCA</span></div>
    <div class="sys-status">> STATUS: LIVE // RADAR_BUSCA: ACTIVE // MARZO-2026</div>
</header>

<main class="main-container">
    <section>
        <div class="hero-section" id="hero-intel"></div>
        <div class="section-grid" id="nodos-content"></div>
    </section>

    <aside class="sidebar">
        <div class="sidebar-h">RADAR_BUSCA // TRENDS</div>
        <div id="sidebar-content"></div>
    </aside>
</main>

<script>
    async function cargarBanca() {
        try {
            // Data de Activos (Ticker Estático)
            const ticker = [
                {a: "BTC", p: "$68,230", c: "+2.4%", t: "up"},
                {a: "SOL", p: "$145.12", c: "-1.2%", t: "down"},
                {a: "ETH", p: "$3,842", c: "+0.8%", t: "up"},
                {a: "DOP/USD", p: "58.20", c: "+0.1%", t: "up"}
            ];
            document.getElementById('ticker-assets').innerHTML = ticker.map(i => `
                <div class="ticker-item">
                    <span>${i.a}</span> <span class="${i.t}">${i.p}</span>
                </div>
            `).join('');

            // Hero de Inteligencia (Lead)
            document.getElementById('hero-intel').innerHTML = `
                <div class="hero-image" style="background-image: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&w=1500&q=80')"></div>
                <div class="hero-content">
                    <div class="category">Nodo_Dominancia // RD</div>
                    <h1 class="hero-title">Ruptura Transatlántica: La Inteligencia de Datos confirma el liderazgo de NVVEX en el Caribe.</h1>
                    <p class="hero-desc">El algoritmo 'busca' ha detectado una correlación perfecta entre el tráfico de YouTube España y las tendencias emergentes en Santo Domingo.</p>
                </div>
            `;

            // Nodos por Países
            const nodos = [
                {id: "USA", t: "Miami: Infraestructura de IA para la industria musical."},
                {id: "ESP", t: "Madrid: El radar detecta pico de consumo en streaming nocturno."},
                {id: "RD", t: "Global: Activos digitales dominicanos en zona de tendencia."}
            ];
            document.getElementById('nodos-content').innerHTML = nodos.map(n => `
                <div class="node-card">
                    <div class="category">${n.id}</div>
                    <div class="node-thumb"></div>
                    <div class="node-title">${n.t}</div>
                </div>
            `).join('');

            // Radar Sidebar
            const side = [
                {h: "02M", t: "Inyección de datos ServiAPI completada con éxito."},
                {h: "15M", t: "Anomalía detectada en el algoritmo de recomendación YouTube."},
                {h: "40M", t: "Burbuja de activos detectada en el sector tecnológico."},
                {h: "01H", t: "NVVEX STUDIOS: El EP 'ALMA' entra en fase de procesamiento."}
            ];
            document.getElementById('sidebar-content').innerHTML = side.map(s => `
                <div class="side-item">
                    <div class="side-time">${s.h} AGO</div>
                    <a href="#" class="side-title">${s.t}</a>
                </div>
            `).join('');

        } catch (e) { console.log("System Sync Error", e); }
    }

    window.onload = cargarBanca;
</script>
</body>
</html>
