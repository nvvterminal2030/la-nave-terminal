<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // INTELLIGENCE WEEKEND</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,900;1,900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --nvvex-purple: #bc13fe;
            --black: #000000;
            --white: #ffffff;
            --gray-light: #f4f4f4;
            --border: #e2e2e2;
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--white); color: var(--black); font-family: var(--font-main); overflow-x: hidden; }

        /* 1. TICKER SUPERIOR (MERCADOS.JSON) */
        .market-ticker-wrap {
            background: var(--black); color: var(--white);
            height: 35px; display: flex; align-items: center;
            font-family: 'Share Tech Mono', monospace; font-size: 0.75rem;
            position: fixed; top: 0; width: 100%; z-index: 3000;
        }
        .market-item { display: inline-block; padding: 0 60px; border-right: 1px solid #333; }

        /* 2. HEADER EDITORIAL */
        .main-header {
            background: var(--white); border-bottom: 3px solid var(--black);
            padding: 20px 60px; position: fixed; top: 35px; width: 100%; z-index: 2000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-box { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; }
        .date-box { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; border-left: 2px solid var(--nvvex-purple); padding-left: 15px; }

        .container { max-width: 1600px; margin: 0 auto; padding: 180px 40px 60px; }

        /* 3. EL HERO (INDUSTRIA.JSON) */
        .hero-grid {
            display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-bottom: 80px;
            border-bottom: 1px solid var(--border); padding-bottom: 60px;
        }
        .hero-img-wrap { height: 550px; overflow: hidden; position: relative; }
        .hero-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .hero-img-wrap:hover img { transform: scale(1.02); }
        
        .hero-content { display: flex; flex-direction: column; justify-content: center; }
        .hero-category { color: var(--nvvex-purple); font-weight: 900; font-size: 0.9rem; margin-bottom: 15px; }
        .hero-title { font-family: var(--font-serif); font-size: 4.5rem; line-height: 0.95; margin-bottom: 25px; }
        .hero-lead { font-size: 1.25rem; color: #444; margin-bottom: 30px; line-height: 1.4; }

        /* 4. LA BANCA (MIKE.JSON) */
        .banca-title { font-family: var(--font-serif); font-size: 2.5rem; margin-bottom: 40px; border-bottom: 2px solid var(--black); display: inline-block; }
        .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .news-card { border-bottom: 1px solid var(--border); padding-bottom: 30px; transition: 0.3s; }
        .news-card:hover { opacity: 0.8; }
        .news-img { width: 100%; height: 260px; object-fit: cover; margin-bottom: 20px; background: #eee; }
        .news-tag { font-size: 0.7rem; font-weight: 900; color: #888; margin-bottom: 10px; display: block; }
        .news-headline { font-size: 1.5rem; font-weight: 800; line-height: 1.2; margin-bottom: 15px; }
        .news-data { font-family: 'Share Tech Mono', monospace; color: var(--nvvex-purple); font-size: 0.85rem; }

        /* 5. TECH STATUS (TECH.JSON) */
        .tech-status-bar {
            margin-top: 80px; padding: 40px; background: var(--gray-light);
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
        }
        .tech-item { border-left: 1px solid #ccc; padding-left: 20px; }
        .tech-label { font-size: 0.7rem; color: #888; font-weight: 900; }
        .tech-val { font-family: 'Share Tech Mono', monospace; font-size: 1rem; color: var(--black); }

        footer { background: var(--black); color: #666; padding: 20px; font-family: 'Share Tech Mono'; font-size: 0.7rem; text-align: center; }

        @media (max-width: 1024px) {
            .hero-grid, .news-grid { grid-template-columns: 1fr; }
            .hero-title { font-size: 3rem; }
        }
    </style>
</head>
<body>

<div class="market-ticker-wrap">
    <marquee id="market-ticker" scrollamount="5"></marquee>
</div>

<header class="main-header">
    <div class="logo-box">NVVEX <span style="font-style: italic; color: var(--nvvex-purple);">WEEKEND</span></div>
    <div class="date-box" id="current-date">DOMINGO, 22 MARZO 2026</div>
    <div style="font-size: 0.7rem; font-weight: 900;">STATUS: <span style="color: green;">EN LÍNEA</span></div>
</header>

<main class="container">
    <section class="hero-grid" id="hero-node"></section>

    <section class="banca-wrap">
        <h2 class="banca-title">Banca de Inteligencia</h2>
        <div class="news-grid" id="mike-node"></div>
    </section>

    <section class="tech-status-bar" id="tech-node"></section>
</main>

<footer>
    © 2026 NVVEX ORIGIN CORE // TODOS LOS DERECHOS RESERVADOS VÍA RADAR BUSCA
</footer>

<script>
    const YT_KEY = 'AIzaSyDdCEv8KTwupFbJQnSQy8Wzw9egXdpJ6HM';

    async function getYTImg(query) {
        try {
            // Filtro inteligente para evitar "basura": Buscamos canales oficiales y música
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${encodeURIComponent(query)}&type=video&videoCategoryId=10&key=${YT_KEY}`);
            const data = await res.json();
            return data.items[0] ? data.items[0].snippet.thumbnails.high.url : '';
        } catch (e) { return ''; }
    }

    async function bootWeekend() {
        try {
            // 1. MERCADOS
            const dMerc = await (await fetch('mercados.json')).json();
            document.getElementById('market-ticker').innerHTML = dMerc.ticker.map(m => `
                <span class="market-item">
                    ${m.asset} <span style="color:#00ff88">${m.price}</span> (${m.change})
                </span>
            `).join('').repeat(4);

            // 2. HERO (INDUSTRIA)
            const dInd = await (await fetch('industria.json')).json();
            const hero = dInd.reportes[0];
            const heroImg = await getYTImg(hero.artista);
            document.getElementById('hero-node').innerHTML = `
                <div class="hero-img-wrap"><img src="${heroImg}"></div>
                <div class="hero-content">
                    <span class="hero-category">INFORME GLOBAL // ${hero.node}</span>
                    <h1 class="hero-title">${hero.artista}</h1>
                    <p class="hero-lead">${hero.analisis}</p>
                    <div style="font-weight:900; font-size:1.2rem;">RANKING: ${hero.rank}</div>
                </div>
            `;

            // 3. BANCA (MIKE)
            const dMike = await (await fetch('mike.json')).json();
            const newsHtml = await Promise.all(dMike.noticias.map(async (n) => {
                const img = await getYTImg(n.titulo);
                return `
                    <article class="news-card">
                        <img src="${img}" class="news-img">
                        <span class="news-tag">${n.hora} // RADAR_DATA</span>
                        <h3 class="news-headline">${n.titulo}</h3>
                        <p class="news-data">VERIFICADO // YT_CORE_V3</p>
                    </article>
                `;
            }));
            document.getElementById('mike-node').innerHTML = newsHtml.join('');

            // 4. TECH
            const dTech = await (await fetch('tech.json')).json();
            document.getElementById('tech-node').innerHTML = dTech.tecnologia.map(t => `
                <div class="tech-item">
                    <div class="tech-label">${t.id}</div>
                    <div class="tech-val">${t.titular}</div>
                    <div style="color:var(--nvvex-purple); font-weight:bold; font-size:0.8rem;">${t.impacto}</div>
                </div>
            `).join('');

        } catch (e) { console.error("BOOT_ERROR", e); }
    }

    window.onload = bootWeekend;
</script>
</body>
</html>
