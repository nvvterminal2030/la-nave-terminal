<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // ORIGIN CORE // STATION 2030</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@200;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --morado: #bc13fe;
            --morado-glow: rgba(188, 19, 254, 0.5);
            --cian: #00f2ff;
            --negro: #040404;
            --glass: rgba(10, 10, 10, 0.9);
            --border: rgba(188, 19, 254, 0.35);
            --font-data: 'Share Tech Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body {
            background: var(--negro); color: #fff; font-family: 'Inter', sans-serif;
            overflow-x: hidden; height: 100vh;
            background-image: radial-gradient(circle at 2px 2px, rgba(188, 19, 254, 0.1) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* MARKET STRIP (NUEVO: mercados.json) */
        .market-strip {
            position: fixed; top: 0; width: 100%; height: 35px;
            background: #000; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; z-index: 2000; overflow: hidden;
        }

        /* HUD PRINCIPAL */
        .hud-header {
            position: fixed; top: 35px; width: 100%; z-index: 1000;
            padding: 15px 40px; display: flex; justify-content: space-between;
            background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
        }

        .main-layout {
            display: grid; grid-template-columns: 1fr 450px; gap: 25px;
            padding: 120px 30px 60px; max-width: 1900px; margin: 0 auto;
        }

        /* BLOQUE IMPACTO (industria.json) */
        .analysis-core {
            background: var(--glass); border: 2px solid var(--border);
            border-radius: 25px; position: relative; overflow: hidden; height: 680px;
            box-shadow: inset 0 0 50px rgba(188, 19, 254, 0.1);
        }

        .hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.3) contrast(1.2); }
        
        .hero-data {
            position: absolute; inset: 0; padding: 50px;
            display: flex; flex-direction: column; justify-content: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, transparent);
        }

        /* MAPA DE NODOS (RD - USA - ESP) */
        .node-map {
            position: absolute; top: 40px; right: 40px; width: 200px; height: 120px;
            border: 1px solid var(--border); background: rgba(0,0,0,0.5); border-radius: 10px;
            padding: 10px; font-family: var(--font-data); font-size: 0.6rem;
        }
        .dot { height: 6px; width: 6px; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1.5s infinite; }
        .dot-rd { background: var(--cian); box-shadow: 0 0 10px var(--cian); }
        .dot-usa { background: #fff; }
        .dot-esp { background: var(--morado); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* TECH NODES (tech.json) */
        .tech-sidebar { display: grid; grid-template-rows: repeat(4, 1fr); gap: 15px; }
        .node-box {
            background: rgba(15,15,15,0.8); border: 1px solid var(--border);
            border-radius: 15px; padding: 20px; transition: 0.3s;
        }
        .node-box:hover { border-color: #fff; transform: scale(1.02); background: rgba(188, 19, 254, 0.05); }

        /* TICKER MIKE (mike.json) */
        .mike-footer {
            position: fixed; bottom: 0; width: 100%; background: #000;
            border-top: 1px solid var(--border); padding: 8px; z-index: 1000;
        }

        /* TYPOGRAPHY & BUTTONS */
        .glitch-text { font-family: var(--font-data); color: var(--morado); letter-spacing: 3px; font-size: 0.7rem; }
        h1 { font-size: 4.5rem; font-weight: 900; line-height: 0.8; letter-spacing: -3px; }
        .btn-action {
            background: var(--morado); color: #000; border: none; padding: 12px 25px;
            font-family: var(--font-data); font-weight: 900; border-radius: 5px;
            clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 85% 100%, 0% 100%);
            transition: 0.3s;
        }
        .btn-action:hover { background: #fff; box-shadow: 0 0 20px #fff; }

        .scan-bar {
            position: absolute; width: 100%; height: 2px; background: var(--morado);
            top: 0; z-index: 10; opacity: 0.5; animation: scanning 5s linear infinite;
        }
        @keyframes scanning { 0% { top: 0%; } 100% { top: 100%; } }

    </style>
</head>
<body>

<div class="market-strip" id="market-flow"></div>

<header class="hud-header">
    <div class="glitch-text">ORIGIN_CORE_STATION // [MAR-2026]</div>
    <div id="live-timer" style="font-family: var(--font-data);">00:00:00:00</div>
    <div class="glitch-text">STATUS: <span style="color:var(--cian)">ACTIVE_SCAN</span></div>
</header>

<main class="main-layout">
    
    <section class="analysis-core" id="ind-block">
        <div class="scan-bar"></div>
        </section>

    <section class="tech-sidebar" id="tech-block">
        </section>

</main>

<footer class="mike-footer">
    <marquee scrollamount="5" style="font-family: var(--font-data); color: #666; font-size: 0.8rem;" id="mike-marquee">
        CARGANDO_FLUJO_DE_NOTICIAS_MIKE...
    </marquee>
</footer>

<script>
    // RELOJ TÁCTICO
    setInterval(() => {
        const d = new Date();
        document.getElementById('live-timer').innerText = 
            `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}:${Math.floor(Math.random()*99).toString().padStart(2,'0')}`;
    }, 50);

    async function launchOriginCore() {
        try {
            // 1. MERCADOS (mercados.json)
            const resMerc = await fetch('mercados.json');
            const dataMerc = await resMerc.json();
            document.getElementById('market-flow').innerHTML = dataMerc.ticker.map(m => `
                <div style="display:inline-block; font-family:var(--font-data); font-size:0.65rem; margin-right:30px;">
                    <span style="color:#555">${m.asset}</span> 
                    <span style="color:#fff">$${m.price}</span> 
                    <span style="color:${m.status === 'UP' ? '#00ff88' : '#ff4444'}">${m.status === 'UP' ? '▲' : '▼'}${m.change}</span>
                </div>
            `).join('').repeat(5); // Repeat para que llene la barra

            // 2. INDUSTRIA (industria.json)
            const resInd = await fetch('industria.json');
            const dataInd = await resInd.json();
            const hero = dataInd.reportes[0];
            document.getElementById('ind-block').innerHTML += `
                <img src="${hero.img}" class="hero-img">
                <div class="node-map">
                    <div style="margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:5px;">ACTIVE_NODES</div>
                    <div><span class="dot dot-rd"></span> RD: ONLINE</div>
                    <div><span class="dot dot-usa"></span> USA: SYNC</div>
                    <div><span class="dot dot-esp"></span> ESP: ACTIVE</div>
                </div>
                <div class="hero-data">
                    <span class="glitch-text">> TARGET_LOCATED // ${hero.node}</span>
                    <h1>${hero.artista}</h1>
                    <p style="max-width:550px; color:#aaa; margin: 20px 0;">${hero.analisis}</p>
                    <div style="display:flex; gap:30px; align-items:center;">
                        <button class="btn-action">EJECUTAR_ACCION</button>
                        <div style="font-family:var(--font-data)">
                            <div style="font-size:0.6rem; color:var(--cian)">PROB_EXITO</div>
                            <div style="font-size:1.5rem; font-weight:bold;">98.2%</div>
                        </div>
                    </div>
                </div>
            `;

            // 3. TECH (tech.json)
            const resTech = await fetch('tech.json');
            const dataTech = await resTech.json();
            document.getElementById('tech-block').innerHTML = dataTech.tecnologia.map(t => `
                <div class="node-box">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="glitch-text" style="font-size:0.5rem;">${t.id}</span>
                        <div style="width:10px; height:2px; background:var(--morado)"></div>
                    </div>
                    <h3 style="margin:8px 0; font-size:1rem;">${t.titular}</h3>
                    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                        <span style="font-family:var(--font-data); color:var(--morado); font-size:1.2rem;">${t.impacto}</span>
                        <span style="font-size:0.6rem; color:#444;">${t.status}</span>
                    </div>
                </div>
            `).join('');

            // 4. MIKE (mike.json)
            const resMike = await fetch('mike.json');
            const dataMike = await resMike.json();
            document.getElementById('mike-marquee').innerHTML = dataMike.noticias.map(n => 
                `[${n.hora}] ${n.titulo.toUpperCase()}`
            ).join(' // ');

        } catch (e) { console.error("CRITICAL_CORE_ERROR", e); }
    }

    window.onload = launchOriginCore;
</script>
</body>
</html>
