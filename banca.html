<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // BANCA DE INTELIGENCIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --morado: #bc13fe; --negro: #000; --verde-data: #39ff14; }
        body { background: var(--negro); color: #fff; font-family: 'Share Tech Mono', monospace; margin: 0; padding: 20px; overflow-x: hidden; }
        
        /* Header Bloomberg Style */
        .banca-header { border-bottom: 2px solid var(--morado); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .banca-title { font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px var(--morado); }
        .status-line { font-size: 0.7rem; color: var(--morado); }

        /* Grid de 3 Bloques */
        .banca-grid { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 20px; }
        .panel { border: 1px solid rgba(188, 19, 254, 0.3); background: rgba(5, 0, 5, 0.9); position: relative; }
        .panel-h { background: var(--morado); color: #000; padding: 3px 10px; font-size: 0.7rem; font-weight: bold; }

        /* Bloque 1: Mercados */
        .market-item { padding: 10px; border-bottom: 1px solid rgba(188, 19, 254, 0.1); display: flex; justify-content: space-between; }
        .val { color: var(--verde-data); }

        /* Bloque 2 y 3: Noticias e Intel */
        .noticia-item { padding: 15px; border-bottom: 1px solid rgba(188, 19, 254, 0.2); }
        .id-stamp { font-size: 0.5rem; color: var(--morado); margin-bottom: 5px; }
        .thumb-yt { width: 80px; height: auto; border: 1px solid var(--morado); float: left; margin-right: 10px; }
        
        @media (max-width: 1024px) { .banca-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="banca-header">
    <div>
        <div class="banca-title">NVVEX // BANCA DE INTELIGENCIA</div>
        <div class="status-line">TERMINAL_ACTIVE // ORIGIN_CORE // ID: BUNKER-MAR</div>
    </div>
    <div id="live-clock" style="color: var(--morado);">00:00:00</div>
</div>

<div class="banca-grid">
    <div class="panel" id="panel-mercados">
        <div class="panel-h">ECONOMÍA_REAL [FIAT_CRYPTO]</div>
        <div id="mercados-content">
            </div>
    </div>

    <div class="panel" id="panel-tech">
        <div class="panel-h">INTELIGENCIA_TECNOLÓGICA</div>
        <div id="tech-content">
            </div>
    </div>

    <div class="panel" id="panel-industria">
        <div class="panel-h">INTELIGENCIA_DE_LA_INDUSTRIA</div>
        <div id="industria-content">
            </div>
    </div>
</div>

<script>
    // Función para actualizar el reloj
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // Motor de Carga Dinámica (Busca en JSONs aparte)
    async function cargarBanca() {
        // Cargar Mercados
        const resMercados = await fetch('mercados.json');
        const dataM = await resMercados.json();
        let htmlM = '';
        dataM.ticker.forEach(item => {
            htmlM += `<div class="market-item"><span>${item.asset}</span><span class="val">${item.price}</span></div>`;
        });
        document.getElementById('mercados-content').innerHTML = htmlM;

        // Cargar Tech e Industria seguirán la misma lógica...
    }
    
    window.onload = cargarBanca;
</script>

</body>
</html>
