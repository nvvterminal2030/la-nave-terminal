<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // ORIGIN CORE // STATION 2030</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@200;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --morado: #bc13fe;
            --cian: #00f2ff;
            --negro: #040404;
            --glass: rgba(10, 10, 10, 0.95);
            --border: rgba(188, 19, 254, 0.3);
            --font-data: 'Share Tech Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body {
            background: var(--negro); color: #fff; font-family: 'Inter', sans-serif;
            overflow-y: auto; overflow-x: hidden;
            background-color: #000;
        }

        /* CAPA DE ESTRELLAS (Creada desde cero) */
        #star-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        /* TICKER MERCADOS */
        .market-strip {
            position: fixed; top: 0; width: 100%; height: 40px;
            background: #000; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; z-index: 2000;
        }
        .market-item {
            display: inline-block; padding: 0 60px;
            font-family: var(--font-data); font-size: 0.8rem;
            border-right: 1px solid #222;
        }

        .hud-header {
            position: fixed; top: 40px; width: 100%; z-index: 1000;
            padding: 15px 40px; display: flex; justify-content: space-between;
            background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
        }

        .content-wrapper { max-width: 1800px; margin: 0 auto; padding: 150px 30px 100px; position: relative; }

        .hero-grid { display: grid; grid-template-columns: 1fr 400px; gap: 30px; margin-bottom: 80px; }

        /* BLOQUE IMPACTO */
        .main-analysis {
            background: var(--glass); border: 2px solid var(--border);
            border-radius: 30px; height: 600px; position: relative; overflow: hidden;
        }
        .hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) grayscale(0.5); }
        .hero-info { position: absolute; inset: 0; padding: 60px; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(to top, #000, transparent); }

        /* TECH NODES */
        .tech-sidebar { display: flex; flex-direction: column; gap: 20px; }
        .tech-card {
            background: rgba(20,20,20,0.8); border: 1px solid var(--border);
            padding: 20px; border-radius: 20px; border-left: 5px solid var(--morado);
            position: relative; overflow: hidden;
        }

        /* NODOS LATAM SELECTOR */
        .latam-nav {
            display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .node-btn {
            background: transparent; border: 1px solid var(--border); color: #fff;
            padding: 8px 20px; font-family: var(--font-data); font-size: 0.8rem;
            border-radius: 5px; transition: 0.3s;
        }
        .node-btn:hover, .node-btn.active { 
            background: var(--morado); border-color: var(--morado); 
            box-shadow: 0 0 15px var(--morado); color: #000;
        }

        /* BANCA DE INTELIGENCIA */
        .banca-container { padding-top: 40px; border-top: 1px solid var(--border); }
        .section-header { font-family: var(--font-data); color: var(--morado); font-size: 1.5rem; margin-bottom: 20px; font-weight: 900; }
        
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px; }
        .news-card {
            background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 25px;
            overflow: hidden; transition: 0.3s; position: relative;
        }
        
        /* EFECTO LÁSER ESCÁNER */
        .news-card::after {
            content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(188, 19, 254, 0.1), transparent);
            animation: scanner 4s linear infinite;
        }
        @keyframes scanner { 0% { top: -100%; } 100% { top: 100%; } }

        .news-img { width: 100%; height: 220px; object-fit: cover; filter: grayscale(1); transition: 0.5s; }
        .news-card:hover .news-img { filter: grayscale(0.2) brightness(0.8); }
        .news-body { padding: 25px; background: rgba(10,10,10,0.9); }
        .news-meta { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.7rem; color: var(--cian); margin-bottom: 10px; }

        .footer-ticker { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid var(--border); padding: 10px; z-index: 1000; }
        .glitch-text { font-family: var(--font-data); color: var(--morado); text-transform: uppercase; letter-spacing: 2px; }

    </style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<div class="market-strip"><marquee scrollamount="5" id="market-ticker"></marquee></div>

<header class="hud-header">
    <div class="glitch-text">STATION_01 // ORIGIN_CORE</div>
    <div id="live-clock" style="font-family: var(--font-data);">00:00:00</div>
    <div class="glitch-text" style="color:var(--cian)">RADAR_BUSCA_ACTIVE</div>
</header>

<div class="content-wrapper">
    <section class="hero-grid">
        <div class="main-analysis" id="industria-node"></div>
        <div class="tech-sidebar" id="tech-node"></div>
    </section>

    <section class="banca-container">
        <div class="section-header">> BANCA_DE_INTELIGENCIA_LATAM</div>
        
        <div class="latam-nav">
            <button class="node-btn active">RD</button>
            <button class="node-btn">PR</button>
            <button class="node-btn">COL</button>
            <button class="node-btn">MEX</button>
            <button class="node-btn">CHI</button>
            <button class="node-btn">ARG</button>
        </div>

        <div class="news-grid" id="mike-node"></div>
    </section>
</div>

<footer class="footer-ticker">
    <marquee id="footer-marquee" style="font-family: var(--font-data); font-size: 0.8rem; color: #555;"></marquee>
</footer>

<script>
    // 1. GENERADOR DE ESTRELLAS (STARS SYSTEM)
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize; resize();

    for(let i=0; i<150; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5,
            speed: Math.random() * 0.5
        });
    }

    function animateStars() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
            ctx.fill();
            s.y += s.speed;
            if(s.y > canvas.height) s.y = 0;
        });
        requestAnimationFrame(animateStars);
    }
    animateStars();

    // 2. RELOJ TIEMPO REAL
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // 3. SINCRONIZACIÓN DE LA NAVE
    async function syncSystem() {
        try {
            // MERCADOS
            const rMerc = await fetch('mercados.json');
            const dMerc = await rMerc.json();
            document.getElementById('market-ticker').innerHTML = dMerc.ticker.map(m => `
                <span class="market-item">
                    <span style="color:#555">${m.asset}</span> 
                    <span style="color:#fff">$${m.price}</span> 
                    <span style="color:${m.status === 'UP' ? '#00ff88' : '#ff4444'}">${m.change}</span>
                </span>
            `).join('').repeat(5);

            // INDUSTRIA
            const rInd = await fetch('industria.json');
            const dInd = await rInd.json();
            const hero = dInd.reportes[0];
            document.getElementById('industria-node').innerHTML = `
                <img src="${hero.img}" class="hero-img">
                <div class="hero-info">
                    <span class="glitch-text" style="color:var(--cian)">[ ${hero.node} ]</span>
                    <h1 style="font-size: 4.5rem; font-weight: 900; line-height: 0.9;">${hero.artista}</h1>
                    <p style="color:#888; margin: 20px 0; max-width: 550px;">${hero.analisis}</p>
                    <div style="font-family:var(--font-data); font-size: 1.8rem; color:var(--morado)">${hero.rank}</div>
                </div>
            `;

            // TECH
            const rTech = await fetch('tech.json');
            const dTech = await rTech.json();
            document.getElementById('tech-node').innerHTML = dTech.tecnologia.map(t => `
                <div class="tech-card">
                    <div class="news-meta"><span>${t.id}</span><span>${t.status}</span></div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 5px;">${t.titular}</h3>
                    <div style="color:var(--morado); font-family:var(--font-data); font-size: 1.2rem;">${t.impacto}</div>
                </div>
            `).join('');

            // BANCA DE INTELIGENCIA (MIKE DATA)
            const rMike = await fetch('mike.json');
            const dMike = await rMike.json();
            document.getElementById('mike-node').innerHTML = dMike.noticias.map((n, i) => `
                <div class="news-card">
                    <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=800&sig=${i}" class="news-img">
                    <div class="news-body">
                        <div class="news-meta">
                            <span>RADAR_BUSCA</span>
                            <span>TIME: ${n.hora}</span>
                        </div>
                        <h3 style="font-size: 1.1rem; margin-bottom: 10px;">${n.titulo}</h3>
                        <div style="font-family:var(--font-data); font-size: 0.65rem; color: var(--morado);">NODO_LATAM_ACTIVE</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('footer-marquee').innerText = dMike.noticias.map(n => `>> ${n.titulo}`).join(' // ');

        } catch (e) { console.error("SYNC_ERROR", e); }
    }

    window.onload = syncSystem;
</script>
</body>
</html>
