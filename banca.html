<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // ORIGIN CORE // STATION 2030</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@200;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --morado: #bc13fe;
            --cian: #00f2ff;
            --negro: #040404;
            --glass: rgba(10, 10, 10, 0.95);
            --border: rgba(188, 19, 254, 0.3);
            --font-data: 'Share Tech Mono', monospace;
        }

        /* RESET & SCROLL */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body {
            background: var(--negro); color: #fff; font-family: 'Inter', sans-serif;
            overflow-y: auto; overflow-x: hidden; /* Scroll habilitado socio */
            background-image: radial-gradient(circle at 2px 2px, rgba(188, 19, 254, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* 1. TICKER MERCADOS (ESPACIADO CORREGIDO) */
        .market-strip {
            position: fixed; top: 0; width: 100%; height: 40px;
            background: #000; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; z-index: 2000;
        }
        .market-item {
            display: inline-block; padding: 0 60px; /* Espacio extra para que no se amontone */
            font-family: var(--font-data); font-size: 0.8rem;
            border-right: 1px solid #222;
        }

        .hud-header {
            position: fixed; top: 40px; width: 100%; z-index: 1000;
            padding: 15px 40px; display: flex; justify-content: space-between;
            background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
        }

        /* MAIN LAYOUT */
        .content-wrapper { max-width: 1800px; margin: 0 auto; padding: 150px 30px 100px; }

        .hero-grid {
            display: grid; grid-template-columns: 1fr 400px; gap: 30px; margin-bottom: 80px;
        }

        /* BLOQUE IMPACTO (industria.json) */
        .main-analysis {
            background: var(--glass); border: 2px solid var(--border);
            border-radius: 30px; height: 600px; position: relative; overflow: hidden;
        }
        .hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) grayscale(0.5); }
        .hero-info { position: absolute; inset: 0; padding: 60px; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(to top, #000, transparent); }

        /* TECH NODES (tech.json) */
        .tech-sidebar { display: flex; flex-direction: column; gap: 20px; }
        .tech-card {
            background: rgba(20,20,20,0.8); border: 1px solid var(--border);
            padding: 20px; border-radius: 20px; border-left: 5px solid var(--morado);
        }

        /* 2. BANCA DE INTELIGENCIA (Bloques de Mike/Tendencias) */
        .banca-container { padding-top: 40px; border-top: 1px solid var(--border); }
        .section-header { font-family: var(--font-data); color: var(--morado); font-size: 1.5rem; margin-bottom: 40px; font-weight: 900; }
        
        .news-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px;
        }
        .news-card {
            background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 25px;
            overflow: hidden; transition: 0.3s;
        }
        .news-card:hover { border-color: var(--morado); transform: scale(1.02); }
        .news-img { width: 100%; height: 220px; object-fit: cover; filter: grayscale(1); }
        .news-body { padding: 25px; }
        .news-meta { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.7rem; color: var(--cian); margin-bottom: 10px; }

        /* TICKER FOOTER */
        .footer-ticker {
            position: fixed; bottom: 0; width: 100%; background: #000;
            border-top: 1px solid var(--border); padding: 10px; z-index: 1000;
        }

        .glitch-text { font-family: var(--font-data); color: var(--morado); text-transform: uppercase; }
    </style>
</head>
<body>

<div class="market-strip">
    <marquee scrollamount="5" id="market-ticker"></marquee>
</div>

<header class="hud-header">
    <div class="glitch-text">STATION_01 // ORIGIN_CORE</div>
    <div id="live-clock" style="font-family: var(--font-data);">00:00:00</div>
    <div class="glitch-text" style="color:var(--cian)">RADAR_BUSCA_ACTIVE</div>
</header>

<div class="content-wrapper">
    <section class="hero-grid">
        <div class="main-analysis" id="industria-node"></div>
        <div class="tech-sidebar" id="tech-node"></div>
    </section>

    <section class="banca-container">
        <div class="section-header">> BANCA_DE_INTELIGENCIA_GLOBAL</div>
        <div class="news-grid" id="mike-node"></div>
    </section>
</div>

<footer class="footer-ticker">
    <marquee id="footer-marquee" style="font-family: var(--font-data); font-size: 0.8rem; color: #555;"></marquee>
</footer>

<script>
    // RELOJ
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    async function syncSystem() {
        try {
            // 1. MERCADOS (SIN AMONTONAR)
            const rMerc = await fetch('mercados.json');
            const dMerc = await rMerc.json();
            document.getElementById('market-ticker').innerHTML = dMerc.ticker.map(m => `
                <span class="market-item">
                    <span style="color:#555">${m.asset}</span> 
                    <span style="color:#fff">$${m.price}</span> 
                    <span style="color:${m.status === 'UP' ? '#00ff88' : '#ff4444'}">${m.change}</span>
                </span>
            `).join('').repeat(5);

            // 2. INDUSTRIA (PAPI CRIS / PRINCIPAL)
            const rInd = await fetch('industria.json');
            const dInd = await rInd.json();
            const hero = dInd.reportes[0];
            document.getElementById('industria-node').innerHTML = `
                <img src="${hero.img}" class="hero-img">
                <div class="hero-info">
                    <span class="glitch-text" style="color:var(--cian)">[ ${hero.node} ]</span>
                    <h1 style="font-size: 5rem; font-weight: 900; line-height: 0.9;">${hero.artista}</h1>
                    <p style="color:#888; margin: 20px 0; max-width: 600px;">${hero.analisis}</p>
                    <div style="font-family:var(--font-data); font-size: 2rem; color:var(--morado)">${hero.rank}</div>
                </div>
            `;

            // 3. TECH NODES
            const rTech = await fetch('tech.json');
            const dTech = await rTech.json();
            document.getElementById('tech-node').innerHTML = dTech.tecnologia.map(t => `
                <div class="tech-card">
                    <div class="news-meta"><span>${t.id}</span><span>${t.status}</span></div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 5px;">${t.titular}</h3>
                    <div style="color:var(--morado); font-family:var(--font-data); font-size: 1.2rem;">${t.impacto}</div>
                </div>
            `).join('');

            // 4. MIKE NEWS (BANCA DE INTELIGENCIA CON IMÁGENES)
            // Nota: Aquí "Busca" e inyecta la data de Mike en los cuadros grandes
            const rMike = await fetch('mike.json');
            const dMike = await rMike.json();
            
            // Usamos las noticias de Mike para llenar la banca
            document.getElementById('mike-node').innerHTML = dMike.noticias.map((n, index) => `
                <div class="news-card">
                    <img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=800&index=${index}" class="news-img">
                    <div class="news-body">
                        <div class="news-meta">
                            <span>NODO_RADAR_SCAN</span>
                            <span>TIME: ${n.hora}</span>
                        </div>
                        <h3 style="font-size: 1.2rem; margin-bottom: 15px;">${n.titulo}</h3>
                        <div style="font-family:var(--font-data); font-size: 0.7rem; color: #444;">SOURCE: NVVEX_BUNKER_SYSTEM</div>
                    </div>
                </div>
            `).join('');

            // Ticker inferior
            document.getElementById('footer-marquee').innerText = dMike.noticias.map(n => `>> ${n.titulo}`).join(' // ');

        } catch (e) { console.error("ERROR_SYNC", e); }
    }

    window.onload = syncSystem;
</script>
</body>
</html>
