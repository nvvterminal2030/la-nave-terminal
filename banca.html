<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // SYSTEM_CORE_2030</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #bc13fe;
            --data: #00f2ff;
            --bg: #000000;
            --line: rgba(188, 19, 254, 0.2);
            --font: 'Share Tech Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { 
            background: var(--bg); color: #fff; font-family: var(--font); 
            overflow: hidden; height: 100vh; font-size: 14px;
        }

        /* CAPA 1: LA REJILLA DE COORDENADAS */
        .grid-layer {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: 1; pointer-events: none;
        }

        /* CAPA 2: EL HUD (MARCO TÉCNICO) */
        .hud-frame {
            position: fixed; inset: 20px;
            border: 1px solid var(--line);
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
        }

        /* SECCIONES ASIMÉTRICAS */
        .terminal-container {
            position: relative; z-index: 20;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            grid-template-rows: 1fr 250px;
            height: 100vh; gap: 2px;
            padding: 60px;
        }

        /* BLOQUE MERCADOS (IZQUIERDA VERTICAL) */
        .sidebar-markets {
            grid-row: 1 / 3; border: 1px solid var(--line);
            background: rgba(5,5,5,0.8); backdrop-filter: blur(10px);
            padding: 20px; display: flex; flex-direction: column; gap: 30px;
        }

        /* BLOQUE IMPACTO (CENTRO - industria.json) */
        .main-view {
            grid-column: 2 / 3; position: relative;
            border: 1px solid var(--neon); overflow: hidden;
            clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
        }
        .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.3; filter: hue-rotate(280deg); }
        .hero-text {
            position: absolute; inset: 40px;
            display: flex; flex-direction: column; justify-content: flex-end;
        }

        /* BLOQUE TECH (DERECHA) */
        .sidebar-tech {
            grid-column: 3 / 4; border: 1px solid var(--line);
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
        }

        /* BANCA DE NOTICIAS (HORIZONTAL ABAJO - mike.json) */
        .bottom-feed {
            grid-column: 2 / 3; border: 1px solid var(--line);
            background: rgba(0,0,0,0.9); display: flex; overflow-x: auto;
            align-items: center; padding: 20px; gap: 40px;
        }

        /* ESTILOS DE DATO */
        .label { color: var(--neon); font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 5px; }
        .value { color: var(--data); font-size: 1.2rem; text-shadow: 0 0 10px var(--data); }
        h1 { font-size: 3.5rem; letter-spacing: -2px; line-height: 0.9; text-transform: uppercase; }

        /* BOTONES TÁCTICOS */
        .btn-node {
            border: 1px solid var(--data); color: var(--data);
            padding: 10px; text-align: center; transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        .btn-node:hover { background: var(--data); color: #000; box-shadow: 0 0 20px var(--data); }

        /* ANIMACIÓN DE ESCANEO */
        .scanner {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--data); opacity: 0.5; box-shadow: 0 0 15px var(--data);
            animation: scan 5s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div class="grid-layer"></div>
<div class="hud-frame">
    <div style="display:flex; justify-content:space-between;">
        <span>NVVEX_OS_V.8.0</span>
        <span id="coords">LAT: 18.48 // LON: -69.93</span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div class="label">STATUS: SYSTEM_READY</div>
        <div class="label" id="timer">00:00:00</div>
    </div>
</div>

<main class="terminal-container">
    
    <aside class="sidebar-markets" id="market-node">
        <div class="label">/MARKET_PULSE</div>
        </aside>

    <section class="main-view" id="industria-node">
        <div class="scanner"></div>
        </section>

    <aside class="sidebar-tech" id="tech-node">
        <div class="label">/SYSTEM_NODES</div>
        </aside>

    <section class="bottom-feed" id="mike-node">
        </section>

</main>

<script>
    const YT_KEY = 'AIzaSyDdCEv8KTwupFbJQnSQy8Wzw9egXdpJ6HM';

    // 1. RELOJ Y COORDENADAS DINÁMICAS
    setInterval(() => {
        document.getElementById('timer').innerText = new Date().toLocaleTimeString();
        document.getElementById('coords').innerText = `LAT: ${(18 + Math.random()).toFixed(2)} // LON: ${(-69 - Math.random()).toFixed(2)}`;
    }, 1000);

    // 2. BUSCADOR DE DATA VISUAL
    async function getThumb(q) {
        try {
            const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${q}&key=${YT_KEY}`);
            const d = await r.json();
            return d.items[0].snippet.thumbnails.high.url;
        } catch(e) { return ''; }
    }

    async function bootSystem() {
        try {
            // Mercados
            const dMerc = await (await fetch('mercados.json')).json();
            document.getElementById('market-node').innerHTML += dMerc.ticker.map(m => `
                <div>
                    <div class="label">${m.asset}</div>
                    <div class="value">${m.price}</div>
                    <div style="font-size:0.7rem; color:${m.status=='UP'?'#00ff88':'#ff3333'}">${m.change}</div>
                </div>
            `).join('');

            // Industria
            const dInd = await (await fetch('industria.json')).json();
            const hero = dInd.reportes[0];
            const img = await getThumb(hero.artista);
            document.getElementById('industria-node').innerHTML += `
                <img src="${img}" class="hero-img">
                <div class="hero-text">
                    <div class="label">> ORIGIN_CORE_REPORT // ${hero.node}</div>
                    <h1>${hero.artista}</h1>
                    <p style="color:var(--data); margin: 10px 0; font-size:0.9rem;">${hero.analisis}</p>
                    <div class="btn-node" style="width:200px; margin-top:20px;">ACCESS_DATA</div>
                </div>
            `;

            // Tech
            const dTech = await (await fetch('tech.json')).json();
            document.getElementById('tech-node').innerHTML += dTech.tecnologia.map(t => `
                <div style="border-bottom:1px solid var(--line); padding-bottom:10px;">
                    <div class="label">${t.id}</div>
                    <div style="font-size:0.9rem;">${t.titular}</div>
                    <div class="value" style="font-size:1rem; margin-top:5px;">${t.impacto}</div>
                </div>
            `).join('');

            // Banca
            const dMike = await (await fetch('mike.json')).json();
            document.getElementById('mike-node').innerHTML = dMike.noticias.map(n => `
                <div style="min-width:300px;">
                    <div class="label">${n.hora} // LIVE_FEED</div>
                    <div style="font-size:0.9rem; line-height:1.2;">${n.titulo}</div>
                </div>
            `).join('');

        } catch(e) { console.log("CRITICAL_BOOT_FAILURE"); }
    }

    window.onload = bootSystem;
</script>
</body>
</html>
