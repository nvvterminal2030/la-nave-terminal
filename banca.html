<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // BANCA DE INTELIGENCIA // 2030</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --morado: #bc13fe;
            --cian: #00f2ff;
            --negro: #000000;
            --gris-oscurisimo: #0a0a0a;
            --border: rgba(188, 19, 254, 0.2);
            --font-main: 'Inter', sans-serif;
            --font-data: 'Share Tech Mono', monospace;
        }

        /* ESTRUCTURA LIMPIA */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { 
            background: var(--negro); color: #fff; font-family: var(--font-main); 
            overflow-y: auto; overflow-x: hidden; line-height: 1.6;
        }

        /* TICKER SUPERIOR (MERCADOS.JSON) - ESPACIADO MÁXIMO */
        .market-bar {
            position: fixed; top: 0; width: 100%; height: 45px;
            background: #000; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; z-index: 2000;
        }
        .market-item {
            display: inline-block; padding: 0 80px; font-family: var(--font-data);
            font-size: 0.85rem; border-right: 1px solid #111; white-space: nowrap;
        }

        /* CABECERA NVVEX */
        .main-header {
            position: fixed; top: 45px; width: 100%; z-index: 1000;
            padding: 20px 60px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
        }

        .container { max-width: 1700px; margin: 0 auto; padding: 180px 40px 100px; }

        /* SECCIÓN 1: REPORTE GLOBAL (INDUSTRIA.JSON) */
        .hero-section {
            display: grid; grid-template-columns: 1.2fr 1fr; gap: 50px; margin-bottom: 100px;
        }
        .hero-visual {
            background: var(--gris-oscurisimo); border: 1px solid var(--border);
            border-radius: 40px; height: 600px; position: relative; overflow: hidden;
        }
        .hero-visual img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); transition: 0.5s; }
        .hero-visual:hover img { filter: brightness(0.8); }

        .hero-content { display: flex; flex-direction: column; justify-content: center; }
        .tag-intel { font-family: var(--font-data); color: var(--morado); letter-spacing: 5px; margin-bottom: 20px; font-weight: bold; }
        h1 { font-size: 5rem; font-weight: 900; line-height: 0.85; margin-bottom: 30px; letter-spacing: -4px; }
        .hero-desc { color: #888; font-size: 1.2rem; max-width: 600px; margin-bottom: 40px; }

        /* SECCIÓN 2: BANCA DE INTELIGENCIA LATAM (MIKE.JSON) */
        .banca-header {
            border-top: 1px solid var(--border); padding-top: 60px; margin-bottom: 50px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .banca-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 40px;
        }

        /* NEWS CARD 2030 */
        .news-card {
            background: var(--gris-oscurisimo); border: 1px solid #111;
            border-radius: 35px; overflow: hidden; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .news-card:hover { border-color: var(--morado); transform: translateY(-10px); }
        .news-img { width: 100%; height: 280px; object-fit: cover; filter: grayscale(1); transition: 0.5s; }
        .news-card:hover .news-img { filter: grayscale(0); }
        .news-body { padding: 40px; }
        .news-meta { font-family: var(--font-data); font-size: 0.75rem; color: var(--cian); margin-bottom: 15px; display: flex; gap: 20px; }
        .news-title { font-size: 1.6rem; font-weight: 700; line-height: 1.2; margin-bottom: 20px; }

        /* SYSTEM STATUS (TECH.JSON) */
        .tech-footer {
            margin-top: 100px; padding: 60px; background: var(--gris-oscurisimo);
            border-radius: 40px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px;
        }
        .tech-node { font-family: var(--font-data); border-left: 1px solid var(--border); padding-left: 20px; }

        /* FOOTER MARQUEE */
        .footer-flow {
            position: fixed; bottom: 0; width: 100%; background: #000;
            border-top: 1px solid var(--border); padding: 12px; z-index: 2000;
        }

        @media (max-width: 1200px) {
            .hero-section { grid-template-columns: 1fr; }
            h1 { font-size: 3.5rem; }
            .banca-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="market-bar">
    <marquee scrollamount="4" id="market-ticker"></marquee>
</div>

<header class="main-header">
    <div style="font-family: var(--font-data); font-weight: 900; letter-spacing: 2px;">NVVEX // <span style="color:var(--morado)">ORIGIN CORE</span></div>
    <div style="font-family: var(--font-data); color: #555;" id="live-clock">00:00:00 // MAR-2026</div>
    <div style="font-family: var(--font-data); color: var(--cian); font-size: 0.8rem;">STATUS: RADAR_ONLINE</div>
</header>

<main class="container">
    
    <section class="hero-section" id="hero-node">
        </section>

    <section class="banca-container">
        <div class="banca-header">
            <div>
                <span class="tag-intel">LATAM_NODES</span>
                <h2 style="font-size: 2.5rem; font-weight: 900;">BANCA DE INTELIGENCIA</h2>
            </div>
            <div style="font-family: var(--font-data); color: #444; text-align: right;">FILTRANDO: RD, PR, COL, MEX, CHI, ARG</div>
        </div>

        <div class="banca-grid" id="banca-node">
            </div>
    </section>

    <section class="tech-footer" id="tech-node">
        </section>

</main>

<footer class="footer-flow">
    <marquee id="footer-marquee" style="font-family: var(--font-data); font-size: 0.85rem; color: #666;"></marquee>
</footer>

<script>
    const YT_KEY = 'AIzaSyDdCEv8KTwupFbJQnSQy8Wzw9egXdpJ6HM';

    // RELOJ
    setInterval(() => { 
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString() + " // MAR-2026"; 
    }, 1000);

    // MOTOR DE INTELIGENCIA VISUAL (YOUTUBE API)
    async function getIntelligenceThumbnail(query) {
        try {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${encodeURIComponent(query)}&key=${YT_KEY}`);
            const data = await res.json();
            return data.items[0] ? data.items[0].snippet.thumbnails.high.url : 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000';
        } catch(e) { return 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000'; }
    }

    async function syncBunker() {
        try {
            // 1. MERCADOS
            const dMerc = await (await fetch('mercados.json')).json();
            document.getElementById('market-ticker').innerHTML = dMerc.ticker.map(m => `
                <span class="market-item">
                    <span style="color:#444">${m.asset}</span> <span style="color:#fff">$${m.price}</span> 
                    <span style="color:${m.status==='UP'?'#00ff88':'#ff4444'}">${m.change}</span>
                </span>`).join('');

            // 2. INDUSTRIA (HERO)
            const dInd = await (await fetch('industria.json')).json();
            const hero = dInd.reportes[0];
            const heroImg = await getIntelligenceThumbnail(hero.artista);
            document.getElementById('hero-node').innerHTML = `
                <div class="hero-visual"><img src="${heroImg}"></div>
                <div class="hero-content">
                    <span class="tag-intel">> NODO_GLOBAL_REPORT</span>
                    <h1>${hero.artista}</h1>
                    <p class="hero-desc">${hero.analisis}</p>
                    <div style="font-family:var(--font-data); font-size: 1.5rem; color:var(--morado)">RANK: ${hero.rank}</div>
                </div>`;

            // 3. MIKE (BANCA LATAM)
            const dMike = await (await fetch('mike.json')).json();
            const newsHtml = await Promise.all(dMike.noticias.map(async (n) => {
                const img = await getIntelligenceThumbnail(n.titulo);
                return `
                    <div class="news-card">
                        <img src="${img}" class="news-img">
                        <div class="news-body">
                            <div class="news-meta"><span>REPORTE_RADAR</span><span>${n.hora}</span></div>
                            <h3 class="news-title">${n.titulo}</h3>
                            <div style="font-family:var(--font-data); font-size: 0.7rem; color: #444;">VERIFICADO VÍA ORIGIN_CORE_API</div>
                        </div>
                    </div>`;
            }));
            document.getElementById('banca-node').innerHTML = newsHtml.join('');
            document.getElementById('footer-marquee').innerText = dMike.noticias.map(n => `>> ${n.titulo}`).join(' // ');

            // 4. TECH
            const dTech = await (await fetch('tech.json')).json();
            document.getElementById('tech-node').innerHTML = dTech.tecnologia.map(t => `
                <div class="tech-node">
                    <div style="color:var(--morado); font-size:0.7rem;">${t.id}</div>
                    <div style="font-weight:bold; margin:5px 0;">${t.titular}</div>
                    <div style="color:var(--cian); font-size:1.1rem;">${t.impacto}</div>
                </div>`).join('');

        } catch (e) { console.error("CRITICAL_SYNC_ERROR", e); }
    }

    window.onload = syncBunker;
</script>
</body>
</html>
