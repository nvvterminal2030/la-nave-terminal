<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVVEX // WEEKEND INTELLIGENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Publico+Headline:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #bc13fe; --black: #000000; --white: #ffffff;
            --gray-border: #e5e5e5; --text-muted: #666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--white); color: var(--black); font-family: 'Inter', sans-serif; }

        /* TICKER (MERCADOS.JSON) */
        .top-ticker {
            background: var(--black); color: var(--white); height: 40px;
            display: flex; align-items: center; font-size: 11px; font-weight: 700;
            position: fixed; top: 0; width: 100%; z-index: 5000;
        }

        /* HEADER BLOOMBERG STYLE */
        header {
            border-bottom: 4px solid var(--black); padding: 25px 50px;
            position: fixed; top: 40px; width: 100%; background: var(--white);
            display: flex; justify-content: space-between; align-items: center; z-index: 4000;
        }
        .brand { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; }
        .edition { font-weight: 900; color: var(--purple); text-transform: uppercase; font-size: 14px; }

        .wrapper { max-width: 1400px; margin: 0 auto; padding: 180px 20px 50px; }

        /* GRID PRINCIPAL */
        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }

        /* HERO (INDUSTRIA.JSON) */
        .hero-article { border-bottom: 1px solid var(--gray-border); padding-bottom: 40px; }
        .hero-img { width: 100%; height: 500px; object-fit: cover; margin-bottom: 20px; }
        .category-tag { color: var(--purple); font-weight: 900; font-size: 12px; margin-bottom: 10px; display: block; }
        .hero-title { font-size: 4rem; font-weight: 900; line-height: 0.95; margin-bottom: 20px; letter-spacing: -3px; }
        .hero-lead { font-size: 1.3rem; color: var(--text-muted); line-height: 1.4; }

        /* SIDEBAR (TECH.JSON) */
        .sidebar { border-left: 1px solid var(--gray-border); padding-left: 40px; }
        .sidebar-title { font-weight: 900; border-bottom: 2px solid var(--black); margin-bottom: 20px; padding-bottom: 5px; }

        /* BANCA DE INTELIGENCIA (MIKE.JSON) */
        .banca-section { margin-top: 60px; border-top: 2px solid var(--black); padding-top: 40px; }
        .banca-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .news-item { border-bottom: 1px solid var(--gray-border); padding-bottom: 20px; }
        .news-img { width: 100%; height: 200px; object-fit: cover; margin-bottom: 15px; }
        .news-headline { font-size: 1.4rem; font-weight: 900; line-height: 1.1; margin-bottom: 10px; }
        .news-meta { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

        marquee { font-family: monospace; }
    </style>
</head>
<body>

<div class="top-ticker"><marquee scrollamount="6" id="ticker-box"></marquee></div>

<header>
    <div class="brand">NVVEX <span class="edition">Weekend Edition</span></div>
    <div id="live-timer" style="font-weight: 700; font-size: 14px;">DOMINGO, 22 MARZO 2026</div>
    <div style="font-weight: 900; font-size: 12px; border: 1px solid #000; padding: 5px 10px;">STATUS: LIVE</div>
</header>

<div class="wrapper">
    <div class="main-layout">
        <div class="main-content">
            <section id="hero-node"></section>
            
            <div class="banca-section">
                <h2 class="sidebar-title">Banca de Inteligencia</h2>
                <div class="banca-grid" id="mike-node"></div>
            </div>
        </div>

        <aside class="sidebar">
            <h2 class="sidebar-title">System Status</h2>
            <div id="tech-node"></div>
        </aside>
    </div>
</div>

<script>
    const YT_KEY = 'AIzaSyDdCEv8KTwupFbJQnSQy8Wzw9egXdpJ6HM';

    async function fetchYT(q) {
        try {
            const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${q}&type=video&videoCategoryId=10&key=${YT_KEY}`);
            const d = await r.json();
            return d.items[0]?.snippet.thumbnails.high.url || '';
        } catch(e) { return ''; }
    }

    async function syncNVVEX() {
        try {
            // 1. LLENAR MERCADOS (DATA NEGRA SUPERIOR)
            const dMerc = await (await fetch('mercados.json')).json();
            document.getElementById('ticker-box').innerHTML = dMerc.ticker.map(m => `
                <span style="margin-right:80px;">${m.asset}: <span style="color:#00ff88">${m.price}</span> (${m.change})</span>
            `).join('').repeat(3);

            // 2. LLENAR HERO (NOTICIA PRINCIPAL)
            const dInd = await (await fetch('industria.json')).json();
            const hero = dInd.reportes[0];
            const hImg = await fetchYT(hero.artista);
            document.getElementById('hero-node').innerHTML = `
                <article class="hero-article">
                    <img src="${hImg}" class="hero-img">
                    <span class="category-tag">${hero.node} // ANALYSIS</span>
                    <h1 class="hero-title">${hero.artista}</h1>
                    <p class="hero-lead">${hero.analisis}</p>
                    <div style="margin-top:20px; font-weight:900;">RANKING ACTUAL: ${hero.rank}</div>
                </article>`;

            // 3. LLENAR BANCA (NOTICIAS EN GRID)
            const dMike = await (await fetch('mike.json')).json();
            const mHtml = await Promise.all(dMike.noticias.map(async n => {
                const img = await fetchYT(n.titulo);
                return `
                <div class="news-item">
                    <img src="${img}" class="news-img">
                    <div class="news-meta">Radar Data // ${n.hora}</div>
                    <h3 class="news-headline">${n.titulo}</h3>
                    <div style="color:var(--purple); font-size:10px; font-weight:900;">VERIFIED BY YT_CORE_V3</div>
                </div>`;
            }));
            document.getElementById('mike-node').innerHTML = mHtml.join('');

            // 4. LLENAR TECH (SIDEBAR)
            const dTech = await (await fetch('tech.json')).json();
            document.getElementById('tech-node').innerHTML = dTech.tecnologia.map(t => `
                <div style="margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:10px;">
                    <div class="news-meta" style="color:var(--purple)">${t.id}</div>
                    <div style="font-weight:900; font-size:15px;">${t.titular}</div>
                    <div style="font-size:12px; color:#444;">IMPACTO: ${t.impacto}</div>
                </div>`).join('');

        } catch(e) { console.log("SYNC_FAIL", e); }
    }
    window.onload = syncNVVEX;
</script>
</body>
</html>
